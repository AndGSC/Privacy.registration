# Levanta PostgreSQL 17 en un contenedor. Toma credenciales del .env,
# expone el puerto solo en 127.0.0.1, persiste los datos en un volumen,
# ejecuta init.sql en instalaciones nuevas y verifica disponibilidad con un healthcheck.

services:
  db:
    image: postgres:17
    container_name: privacy_data_proyect_one
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "127.0.0.1:${DB_PORT}:5432"
    volumes:
      - privacy_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  privacy_data: